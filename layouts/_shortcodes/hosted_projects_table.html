{{ if .IsNamedParams }}
  {{ $data := index site.Data (.Get "file") }}
  <table class="table table-striped caption-top">
    <caption>
      Hosted projects ({{ len $data }} projects)
    </caption>
    <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Services</th>
      </tr>
    </thead>
    <tbody>
      {{ range $data }}
        <tr>
          <td>{{ .name }}</td>
          <td>{{ .description }}</td>
        </tr>
      {{ end }}
    </tbody>
  </table>
{{- end -}}
