{{ define "main" }}
  <div class="container-site py-4">
    <h1 data-pagefind-meta="title">{{ .Title }}</h1>
    {{ .Content }}
    <ul class="tag-list mt-3">
      {{ range .Data.Terms.ByCount }}
        <li>
          <a class="badge text-bg-secondary text-decoration-none" href="{{ .Page.RelPermalink }}">
            #{{ .Page.LinkTitle }} ({{ .Count }})
          </a>
        </li>
      {{ end }}
    </ul>
  </div>
{{ end }}
