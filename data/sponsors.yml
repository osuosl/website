# Sponsors, in display order. name/url/logo drive the homepage logo
# strip; blurb (markdown) additionally renders on /about/sponsors via
# the sponsors shortcode.
- name: IBM
  url: https://www.ibm.com/
  logo: /images/ibm-logo_small.jpg
  blurb: |
    **IBM** is a long-standing supporter of the Open Source Lab, contributing both valuable hardware resources and
    financial support.

    A strong advocate, sponsor, and contributor to the Linux developer community and open technology development, IBM
    continues this tradition by generously contributing POWER servers to the OSL. These systems provide essential
    infrastructure for the community to develop Linux and open source projects on the Power Architecture. For more
    information and SSH-based remote access, please visit our [development hosting](/services/powerdev) page.
- name: Red Hat
  url: https://www.redhat.com/
  logo: /images/redhat-logo.svg
  blurb: |
    **Red Hat** is the leading provider of enterprise open source software solutions, specializing in Linux, cloud
    computing, and container technologies.

    Red Hat's mission is to advance open source development and foster innovation across the technology industry.
    Their commitment to the open source community is demonstrated through significant financial contributions that
    enable the OSL to continue providing critical infrastructure and support to open source projects worldwide.
- name: Microsoft
  url: https://www.microsoft.com/
  logo: /images/microsoft-logo.svg
  blurb: |
    **Microsoft** is a global technology leader with extensive involvement in the open source ecosystem, maintaining
    thousands of open source projects on GitHub.

    Microsoft supports the OSL through generous financial contributions, recognizing the vital role that open source
    infrastructure plays in enabling innovation and community-driven development. This funding helps the OSL deliver
    reliable hosting and services to the open source community.
- name: Intel
  url: https://www.intel.com/
  logo: /images/Intel_logo_2023.svg
  blurb: |
    **Intel** is a global leader in silicon manufacturing and computing technology.

    Intel has significantly supported the OSL by donating modern server hardware. This contribution has been crucial
    for refreshing our systems with newer, more powerful, and energy-efficient infrastructure, enhancing the
    performance and reliability of the open source projects we host.
- name: Google
  url: https://www.google.com/
  logo: /images/Google_2015_logo.svg
  blurb: |
    **Google** is a global technology leader and a major force in the open source ecosystem.

    Google's support for the OSL comes in the form of substantial financial grants. This funding is critical for
    providing essential infrastructure services to the open source community, including reliable physical hosting,
    vital bandwidth, and critical 'Smart Hands' support. Beyond their direct support of the OSL, Google is a major
    contributor to the open source movement, developing numerous open source projects and sponsoring initiatives like
    the Summer of Code program.
- name: Tag1 Consulting
  url: https://tag1.com/
  logo: /images/tag1_logo.png
  blurb: |
    **Tag1 Consulting** specializes in architecting, optimizing, securing, and delivering large-scale applications and
    infrastructures.

    As demonstrated by their significant contributions to projects like Yjs and Goose, and their position as a leading
    contributor to Drupal (#2 all-time), Tag1 Consulting is deeply invested in the success of open source. Tag1
    supports the OSL through financial contributions, which are vital in enabling us to provide reliable
    infrastructure and services to the open source community.
- name: TDS Telecom
  url: https://tdstelecom.com/
  logo: /images/tds_logo.jpg
  blurb: |
    **TDS Telecom** is a major provider of broadband and voice services.

    TDS Telecom provides significant support to the OSL through a generous donation of bandwidth. This substantial
    contribution, totaling 40 gigabits over a five-year period, greatly enhances the OSL's ability to deliver open
    source software to millions globally. In addition to the bandwidth, TDS hosts several OSU servers in their data
    centers, enabling the OSL to maintain critical mirroring servers in geographically diverse locations like New
    York, NY, and Chicago, IL. This distributed infrastructure allows faster, more reliable downloads for users
    accessing mirrored project files.
