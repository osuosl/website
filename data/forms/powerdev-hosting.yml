# OpenPOWER OpenStack hosting request form
# (content/services/powerdev/request-hosting.md).
# Field `name` keys are the formsender POST parameters — never change
# them; the ticket templates on the formsender side key on them.
send_to: PowerDev
subject_prefix: New PowerLinux/OpenPOWER Hosting Request
contact: powerdev-request@osuosl.org
fields:
  - name: name
    label: Name
    required: true
    autocomplete: name
  - name: email
    label: Email
    type: email
    required: true
    autocomplete: email
  - name: requester_role
    label: Your role in the project
    required: true
    description: For example, maintainer, core developer or researcher.
  - name: project_name
    label: Project name
    required: true
    description: The open source project or education institution this request supports.
  - name: project_url
    label: Project URL
    required: true
    description: The main website for the project or institution.
  - name: source_code_url
    label: Source code repository
    description:
      Where your project's code is developed, such as a GitHub, GitLab or Codeberg URL. Leave this blank if your project
      isn't software.
  - name: software_license
    label: Software license
    required: true
    description:
      What license is your project released under? We only host projects released under an
      [OSI-approved license](https://opensource.org/licenses).
  - name: est_size_of_user_community
    label: Estimated size of user community
    required: true
    description: Rough numbers of users and of active contributors, such as 5,000 users and 20 contributors.
  - name: description_of_project_mission
    label: Description of project mission
    type: textarea
    required: true
    description: Describe your project's mission and how the POWER architecture will support it.
  - name: expected_usage_model
    label: Expected usage model
    type: textarea
    required: true
    description:
      What will you use the VMs for? For example, compiling builds, performance testing or troubleshooting
      architecture-specific issues.
  - name: anticipated_duration_of_need
    label: Anticipated duration of need
    required: true
    description: How long do you expect to need these resources? Ongoing or indefinite is fine.
  - name: ibm_advocate
    label: IBM advocate
    required: true
    description:
      If you don't have an IBM advocate, we need to assign one before we can give you access. The OSL and IBM will work
      with you to find one.
  - name: deployment_timeframe
    label: Deployment timeframe
    type: select
    value: Within 7 business days
    options:
      - Within 7 business days
      - Within 3 business days
      - Within 1 business day
    description:
      Access normally takes up to 7 business days. If you need it sooner, choose a shorter time frame and we will do our
      best to meet it.
  - type: heading
    label: VM details
    id: openstack-questions
  - name: power_architecture
    label: POWER architecture
    type: select
    required: true
    value: POWER10
    options:
      - POWER10
      - POWER9
  - name: instance_vcpus
    label: vCPUs
    type: select
    required: true
    placeholder: "- Select -"
    options: ["1", "2", "4", "8", "16", "24", "32"]
    description:
      Each vCPU is one hardware thread on the host. If you need more CPU, memory or disk than we list here, choose the
      largest option and explain what you need in the "Anything else we should know?" field at the end of the form.
  - name: instance_memory
    label: Memory
    type: select
    required: true
    placeholder: "- Select -"
    options: [4 GB, 6 GB, 8 GB, 12 GB, 16 GB, 24 GB, 32 GB, 48 GB, 64 GB, 96 GB, 128 GB]
  - name: instance_disk
    label: Root disk
    type: select
    required: true
    placeholder: "- Select -"
    options: [40 GB, 60 GB, 80 GB, 100 GB, 200 GB, 300 GB, 400 GB, 500 GB]
    description:
      POWER10 root disks use local NVMe storage. POWER9 VMs can use either local NVMe or SSD-backed Ceph storage, so
      tell us if you have a preference in the "Anything else we should know?" field at the end of the form.
  - name: additional_volume
    label: Attached storage volume
    type: select
    placeholder: "- None -"
    options: [100 GB, 250 GB, 500 GB, 1 TB, 2 TB, 3 TB, 4 TB]
    description:
      A separate block storage volume attached to the VM as a second disk, in addition to the root disk. Use it for
      data such as build caches, artifacts or package repositories. Leave this at None if the root disk is enough.
  - name: additional_volume_type
    label: Attached storage type
    type: select
    placeholder: "- Select -"
    options:
      - HDD
      - SSD
    description:
      If you leave this blank, we will use HDD storage. Choose SSD if your workload needs faster disk, and tell us why
      in the "Anything else we should know?" field at the end of the form.
  - name: number_of_nodes
    label: Number of VMs
    type: number
    required: true
    value: "1"
    min: "1"
  - name: distribution
    label: Distribution
    type: select
    required: true
    placeholder: "- Select -"
    options:
      - AlmaLinux
      - CentOS Stream
      - Debian
      - Fedora
      - openSUSE
      - Rocky Linux
      - Ubuntu
      - Other
    description:
      We will install the latest stable release available for ppc64le unless you ask for a specific version in the
      "Anything else we should know?" field at the end of the form.
  - name: openstack_access
    label: OpenStack access
    type: select
    required: true
    placeholder: "- Select -"
    options:
      - Have the OSL create the VM(s) for me
      - Give me access to the OpenStack GUI/API
    description:
      We can create the VM for you, or we can give you access to the OpenStack GUI and API so you can manage it
      yourself.
  - name: ssh_public_key
    label: SSH public key
    type: textarea
    required: true
    description: Public SSH key to use for initial access to the VM.
  - type: heading
    label: Other details
  - name: other_information
    label: Anything else we should know?
    type: textarea
