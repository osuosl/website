# Hosting offerings. The home page shows each as a card (description); the
# services page gives each a section (details, in Markdown). Every page under
# an offering's url gets a request_label button for its request_url.
- name: General Hosting
  url: /services/hosting/
  request_url: /services/hosting/request/
  request_label: Request hosting
  description: >-
    Open source projects are invited to use our hosting services for development, which can be set up based on your
    needs.
  details: >-
    The OSL hosts more than 300 leading open source [communities](/projects), including Debian, Fedora, Gentoo, GNOME
    and Drupal. We work with each project to meet its needs and build an infrastructure that grows along with it.
    Hosting covers virtual machines, CI/CD resources, FTP mirroring, email and mailing lists, websites, collaboration
    tools, databases, object storage, DNS and co-location, and our [Hosting Details](/services/hosting/details/) page
    describes each one.

- name: AArch64
  url: /services/aarch64/
  request_url: /services/aarch64/request-hosting/
  request_label: Request an AArch64 VM
  description: >-
    Use our AArch64 servers to develop and test open source projects on the AArch64 architecture platform.
  details: >-
    The OSL partners with [Ampere Computing](https://amperecomputing.com/) to host
    [AArch64](https://en.wikipedia.org/wiki/ARM_architecture#AArch64)-based servers, making AArch64 virtual machines
    available to the open source community through our OpenStack cluster. These systems are intended for functional
    development and testing, not for performance testing.

- name: OpenPOWER
  url: /services/powerdev/
  request_url: /services/powerdev/request-hosting/
  request_label: Request a POWER VM
  description: >-
    Use our OpenStack-based POWER servers to develop and test open source projects on the Power architecture platform
    and in a PowerLinux environment.
  details: >-
    The OSL partners with [IBM](https://www.ibm.com/power) to host POWER-based servers, making POWER9 and POWER10
    virtual machines available to the open source community through our OpenStack cluster. These systems are intended
    for functional development, testing and continuous integration, not for performance testing.

- name: POWER CI
  url: /services/powerdev/
  request_url: /services/powerdev/request-ci/
  request_label: Request POWER CI access
  description: >-
    An OSL-managed Jenkins service hosted on our OpenStack cluster, giving projects easier access to the POWER
    architecture for continuous integration.
  details: >-
    POWER CI is a Jenkins service at <https://powerci.osuosl.org> for building and testing projects on POWER. Projects
    register their GitHub repositories and configure their own builds, which run in Docker containers.

- name: IBM Z CI
  url: /services/ibm-z/
  request_url: /services/ibm-z/request-ci/
  request_label: Request IBM Z CI access
  description: >-
    Use our IBM Z based servers to host projects, with access to the s390x architecture via Jenkins.
  details: >-
    The OSL partners with [Marist University](https://www.marist.edu/) to provide access to IBM Z-based servers through
    IBM Z CI, a Jenkins service at <https://ibmz-ci.osuosl.org> that lets open source projects build and test on the
    s390x architecture.
